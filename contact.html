<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Land - تواصل معنا</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Tajawal", sans-serif;
            background-color: #f9f9f9;
            color: #444;
        }


        .header {
            width: 100%;
            height: 110px;
            background-color: #043837;
            border-bottom: #087A79 solid 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .company-name {
            color: white;
            font-size: 25px;
            font-weight: 600;
        }

        #menu {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #menu .btn {
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 10px;
            transition: background 0.3s;
        }

        #menu .btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        #menu .active {
            background-color: #087A79;
        }

        #main-body {

            max-width: 1100px;
            margin: 50px auto;
            padding: 0 25px;

        }

        .page-title {

            text-align: center;
            color: #043837;
            margin-bottom: 45px;

        }

        .page-title h1 {

            font-size: 34px;
            margin-bottom: 10px;

        }

        .page-title p {

            color: #777;
            font-size: 17px;

        }

        .contact-container {

            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;

        }


        .contact-card {
            background-color: white;
            width: 300px;
            min-height: 190px;
            padding: 30px 20px;
            border-radius: 12px;
            border-top: 5px solid #087A79;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.3s;

        }


        .contact-card:hover {

            transform: translateY(-5px);

        }


        .contact-card .icon {

            font-size: 35px;
            margin-bottom: 10px;

        }


        .contact-card h2 {

            color: #087A79;
            font-size: 22px;
            margin: 10px 0;

        }


        .contact-card p {
            color: #555;
            font-size: 16px;
            line-height: 1.8;

        }


        .contact-card a {
            color: #087A79;
            text-decoration: none;

        }


        .contact-card a:hover {

            text-decoration: underline;

        }

        #footer {

            background: #043837;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            margin-top: 60px;

        }

        #footer h5 {

            font-weight: 400;

        }

        @media (max-width: 700px) {

            .header {

                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }


            #menu {

                flex-wrap: wrap;
                justify-content: center;

            }


            .page-title h1 {

                font-size: 28px;

            }


            .contact-card {

                width: 100%;
                max-width: 350px;

            }

        }

    </style>

</head>


<body>

    <div class="header">

        <div class="company-name">
            Smart Land
        </div>


        <div id="menu">

            <a href="index.html" class="btn">
                الرئيسية
            </a>

            <a href="about.html" class="btn">
                من نحن
            </a>

            <a href="services.html" class="btn">
                الخدمات
            </a>

            <a href="projects.html" class="btn">
                المشاريع
            </a>

            <a href="contact.html" class="btn active">
                تواصل معنا
            </a>

        </div>

    </div>

    <div id="main-body">

        <div class="page-title">

            <h1>
                تواصل معنا
            </h1>

            <p>
                يسعدنا تواصلكم معنا والاستفسار عن خدماتنا وحلولنا التقنية
            </p>

        </div>

        <div class="contact-container">

            <div class="contact-card">

                <div class="icon">
                    📧
                </div>

                <h2>
                    البريد الإلكتروني
                </h2>

                <p>
                    <a href="mailto:info@smartland.com">
                        info@smartland.com
                    </a>
                </p>

            </div>

            <div class="contact-card">

                <div class="icon">
                    📞
                </div>

                <h2>
                    رقم الهاتف
                </h2>

                <p>
                    <a href="tel:+963111234567">
                        +963 11 123 4567
                    </a>
                </p>

            </div>

            <div class="contact-card">

                <div class="icon">
                    📍
                </div>

                <h2>
                    موقع الشركة
                </h2>

                <p>
                    دمشق، سوريا
                </p>

            </div>


        </div>
    </div>

    <div id="footer">

        <h5>
            جميع الحقوق محفوظة - شركة Smart Land © 2026
        </h5>

    </div>


</body>

</html>
